name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/moirai

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit
      - run: npm pack --dry-run

  quality:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-package: ./...
      - name: Fuzz codecs
        run: go test -run=^$ -fuzz=FuzzCodecsDoNotPanic -fuzztime=30s
      - name: Fuzz selectors
        run: go test -run=^$ -fuzz=FuzzSelectorDoesNotPanic -fuzztime=30s
      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm test && npm audit
      - name: Validate canonical fixtures against JSON Schema
        run: node .github/scripts/validate-schema.mjs
      - name: Verify Go and TypeScript archives in both directions
        run: |
          mkdir -p /tmp/moirai-interop
          go build -o /tmp/moirai-interop/moirai ./cmd/moirai
          for source in testdata/archive-interop-session.json testdata/archive-interop-numbers.json; do
            name="$(basename "$source" .json)"
            go_archive="/tmp/moirai-interop/${name}-go.moirai"
            typescript_archive="/tmp/moirai-interop/${name}-typescript.moirai"
            /tmp/moirai-interop/moirai archive create "$source" --from simple --out "$go_archive"
            node .github/scripts/archive-interop.mjs "$go_archive" "$typescript_archive" "$source"
            /tmp/moirai-interop/moirai archive verify "$typescript_archive"
          done
